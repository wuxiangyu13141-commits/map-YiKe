<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Y4569 古今时空扩散图</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  </head>
  <body>
    <div class="bg-overlay"></div>
    <button id="fullscreenBtn" type="button" title="全屏 (F11)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-title">
          <p class="eyebrow">Y4569 Demo</p>
          <h1>父系C-Y4569古今时空扩散图</h1>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">当前时间</div>
          <div class="stat-card-value" id="currentTimeLabel">距今 5000 年</div>
          <div class="stat-card-mode" id="currentModeLabel">古代扩散阶段</div>
          <div class="stat-card-tick" id="tickLabel">第 1 格 / 51 格</div>
        </div>
      </header>

      <main class="layout">
        <section class="map-panel">
          <div class="map-frame">
            <svg id="mapSvg" class="map-svg" viewBox="570 40 370 220" preserveAspectRatio="xMidYMid meet">
              <defs>
                <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="2.4" result="soft"></feGaussianBlur>
                  <feColorMatrix in="soft" type="saturate" values="1.1"></feColorMatrix>
                </filter>
                <filter id="pointGlow" x="-40%" y="-40%" width="180%" height="180%">
                  <feGaussianBlur stdDeviation="1.4" result="blur"></feGaussianBlur>
                  <feMerge>
                    <feMergeNode in="blur"></feMergeNode>
                    <feMergeNode in="SourceGraphic"></feMergeNode>
                  </feMerge>
                </filter>
                <filter id="branchGlow" x="-80%" y="-80%" width="260%" height="260%">
                  <!-- 外层大范围软光晕（第一层） -->
                  <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="outerSoft"></feGaussianBlur>
                  <!-- 中层清晰发光（第二层） -->
                  <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="innerGlow"></feGaussianBlur>
                  <feComponentTransfer in="innerGlow" result="brightInner">
                    <feFuncR type="linear" slope="1.8"></feFuncR>
                    <feFuncG type="linear" slope="1.8"></feFuncG>
                    <feFuncB type="linear" slope="1.8"></feFuncB>
                  </feComponentTransfer>
                  <feMerge>
                    <feMergeNode in="outerSoft"></feMergeNode>
                    <feMergeNode in="brightInner"></feMergeNode>
                    <feMergeNode in="SourceGraphic"></feMergeNode>
                  </feMerge>
                </filter>
                <filter id="branchGlowHigh" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="9" result="blur"></feGaussianBlur>
                  <feComponentTransfer in="blur" result="brightBlur">
                    <feFuncR type="linear" slope="1.6"></feFuncR>
                    <feFuncG type="linear" slope="1.6"></feFuncG>
                    <feFuncB type="linear" slope="1.6"></feFuncB>
                  </feComponentTransfer>
                  <feMerge>
                    <feMergeNode in="brightBlur"></feMergeNode>
                    <feMergeNode in="SourceGraphic"></feMergeNode>
                  </feMerge>
                </filter>
                <!-- 人群扩散区域柔化滤镜：椭圆形状 + 边界模糊消散效果 -->
                <filter id="branchFuzzyEdge" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
                </filter>
              </defs>
              <image href="新版地图.png" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
              <g id="focusLayer"></g>
              <g id="flowLayer"></g>
              <g id="trailLayer"></g>
              <g id="ancientLayer"></g>
              <g id="pointLayer"></g>
              <g id="branchLabelLayer"></g>
              <g id="regionOverlayLayer"></g>
            </svg>
            <!-- 地图缩放控件（右上角） -->
            <div class="map-zoom-controls">
              <button id="mapZoomIn" type="button" class="tree-ctrl-btn" title="放大">+</button>
              <button id="mapZoomOut" type="button" class="tree-ctrl-btn" title="缩小">−</button>
              <button id="mapZoomReset" type="button" class="tree-ctrl-btn" title="还原视角">↺</button>
            </div>
          </div>
          <div class="timeline-card">
            <div class="controls">
              <button id="playButton" type="button">开始播放</button>
              <button id="jumpModernButton" type="button">跳到现代</button>
            </div>
            <div class="timeline-wrapper">
              <button id="timelinePlayButton" type="button" class="timeline-play-btn" title="从此时间点开始播放">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path d="M8 5v14l11-7z"></path>
                </svg>
              </button>
              <input id="timelineSlider" type="range" min="0" max="50" step="1" value="0" />
            </div>
            <div class="timeline-marker" id="originMarker">
              <span class="timeline-marker-dot"></span>
              <span class="timeline-marker-text" id="originMarkerText">宗族出现起点</span>
            </div>
            <div class="axis-labels">
              <span class="axis-label axis-label-start" style="--pos: 0%;">距今 5000 年</span>
              <span class="axis-label" style="--pos: 50%;">距今 2500 年</span>
              <span class="axis-label" style="--pos: 80%;">距今 1000 年</span>
              <span class="axis-label axis-label-end" style="--pos: 100%;">现代</span>
            </div>
          </div>
        </section>

        <aside class="info-panel">
          <!-- 隐藏的旧元素保留以兼容JS -->
          <div style="display:none">
            <div id="branchLegend" class="branch-legend"></div>
            <div id="sampleList" class="sample-list"></div>
          </div>

          <!-- 谱系树卡片 -->
          <section class="panel-card tree-card">
            <div class="tree-card-header">
              <h2>世系谱系树</h2>
              <div class="tree-btn-group">
                <button id="treeZoomIn" class="tree-ctrl-btn" title="放大">+</button>
                <button id="treeZoomOut" class="tree-ctrl-btn" title="缩小">−</button>
                <button id="treeResetView" class="tree-ctrl-btn" title="还原视角">↺</button>
                <button id="treeExpandBtn" class="tree-ctrl-btn" title="展开全图">&#x2922;</button>
              </div>
            </div>
            <div class="tree-viewport" id="treeViewport">
              <div id="treeSvg" style="width:100%;height:100%;"></div>
            </div>
          </section>
        </aside>
      </main>
    </div>

    <script src="data/y4569-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
