<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家族谱系图 - 全息深空星图版</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; 
            /* 【核心修改】深邃的深蓝色背景 */
            background-color: #0A0F1C; 
            /* 叠加一层极其微妙的径向渐变，增加屏幕中央的光晕质感 */
            background-image: radial-gradient(circle at 50% 50%, #111A2E 0%, #0A0F1C 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            touch-action: none; 
        }
        #main { width: 100%; height: 100%; cursor: grab; }
        #main:active { cursor: grabbing; }

        /* 【核心修改】暗色毛玻璃工具栏 */
        .toolbar {
            position: fixed; left: 24px; top: 50%; transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border-radius: 40px; display: flex; flex-direction: column; 
            align-items: center; padding: 20px 12px; gap: 16px; z-index: 1000; user-select: none; 
        }
        .hand-indicator { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 20px; }
        .hand-indicator span { font-size: 11px; color: #94A3B8; font-weight: 600; white-space: nowrap; }
        .btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); color: #F1F5F9; font-size: 18px; font-weight: bold;
            cursor: pointer; width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); outline: none; -webkit-tap-highlight-color: transparent; 
        }
        .btn:hover, .btn:active { background: #00E1FD; color: #0A0F1C; border-color: #00E1FD; transform: scale(0.95); box-shadow: 0 0 15px rgba(0, 225, 253, 0.4); }
        #btn-reset { font-size: 16px; margin-top: 4px; }
        
        .slider-wrapper { height: 120px; width: 30px; display: flex; justify-content: center; align-items: center; }
        input[type=range] { -webkit-appearance: none; width: 120px; background: transparent; outline: none; transform: rotate(-90deg); }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; 
            background: #00E1FD; cursor: pointer; margin-top: -8px; 
            box-shadow: 0 0 10px rgba(0, 225, 253, 0.5); border: 2px solid #0A0F1C;
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px; }
    </style>
</head>
<body>

    <div id="main"></div>

    <div class="toolbar">
        <div class="hand-indicator">✋<span>拖拽浏览</span></div>
        <button class="btn" id="btn-zoom-in" title="放大">+</button>
        <div class="slider-wrapper"><input type="range" id="zoom-slider" min="0.3" max="3" step="0.05" value="1"></div>
        <button class="btn" id="btn-zoom-out" title="缩小">-</button>
        <button class="btn" id="btn-reset" title="还原居中">↺</button>
    </div>

    <script>
        var chartDom = document.getElementById('main');
        var myChart = echarts.init(chartDom);

        // 【暗黑模式色板重构】
        const COLORS = {
            primary: '#2979FF',         // 目标节点：亮蓝色
            rootBg: '#0F172A',          // 根节点：极深蓝
            nodeBorder: '#334155',      // 默认节点边框：暗灰蓝
            textMuted: '#94A3B8',       // 柔和的文字颜色
            dimmedLine: '#233043',      // 【熄灯底纹】：深空灰蓝，融入背景但不消失
            glowShadow: 'rgba(0, 225, 253, 0.6)' // 霓虹青色发光层
        };

        const getLineGradient = (startColor, endColor) => ({
            type: 'linear', x: 0, y: 0, x2: 1, y2: 0,
            colorStops: [ { offset: 0, color: startColor }, { offset: 1, color: endColor } ]
        });
        
        const GRADIENTS = {
            default: getLineGradient('#3B4D6B', '#475A77') // 默认未选中的连线（比底纹略亮）
        };

        // 【霓虹光纤渐变色】在黑夜中极其明亮
        const GLOW_START = '#00E1FD'; // 霓虹青 (Neon Cyan)
        const GLOW_END   = '#2979FF'; // 荧光蓝 (Electric Blue)

        function interpolateColor(color1, color2, factor) {
            if (factor < 0) factor = 0; if (factor > 1) factor = 1;
            let r1 = parseInt(color1.substring(1, 3), 16), g1 = parseInt(color1.substring(3, 5), 16), b1 = parseInt(color1.substring(5, 7), 16);
            let r2 = parseInt(color2.substring(1, 3), 16), g2 = parseInt(color2.substring(3, 5), 16), b2 = parseInt(color2.substring(5, 7), 16);
            let r = Math.round(r1 + factor * (r2 - r1)), g = Math.round(g1 + factor * (g2 - g1)), b = Math.round(b1 + factor * (b2 - b1));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function getSegmentGradient(startRatio, endRatio) {
            return {
                type: 'linear', x: 0, y: 0, x2: 1, y2: 0,
                colorStops: [
                    { offset: 0, color: interpolateColor(GLOW_START, GLOW_END, startRatio) },
                    { offset: 1, color: interpolateColor(GLOW_START, GLOW_END, endRatio) }
                ]
            };
        }

        const rawTreeData = {
            name: 'C_TAHI\n(包)', symbol: 'roundRect', symbolSize: [65, 40], 
            // 根节点也增加了发光科幻感
            itemStyle: { color: COLORS.rootBg, borderColor: '#00E1FD', borderWidth: 1.5, borderRadius: 8, shadowColor: 'rgba(0, 225, 253, 0.3)', shadowBlur: 15 },
            label: { position: 'inside', color: '#fff', fontSize: 13, fontWeight: 'bold' },
            children: [
                {
                    name: 'Y4541 (?)',
                    children: [
                        { name: 'Y4541-Y104500 (张)' },
                        { name: '', children: [{ name: 'Y4541-BY182928 (?)' }, { name: 'Y4541-BY182928 (?)' }] },
                        { name: 'Y4541-Y12782 (项)', children: [ { name: 'Y4569-Y4541-Y12782-MF317986 (?)', children: [ { name: 'Y4569-Y4541-Y12782-MF317986-MV154461 (何)' }, { name: 'Y4569-Y4541-Y12782-MF317986-MV154461 (云)' }, { name: 'Y4541-Y12782-MF317986-Y20798 (哈)' }, { name: 'Y4541-Y12782-MF317986-Y20798 (窑)' }, { name: 'Y4541-Y12782-MF317986-Y20085 (?)', children: [ { name: 'Y4569-Y4541-Y12782-MF317986-Y20085-Y20087 (安)' }, { name: 'Y4569-Y4541-Y12782-MF317986-Y20085-Y20087 (?)' } ] } ] } ] },
                        { name: 'Y4541 (?)' }, { name: 'Y4541 (孛儿只斤)' }, { name: 'Y4541 (王)' },
                        { name: '', children: [{ name: 'Y4541-MF193836 (茹)' }, { name: 'Y4541-MF193836 (张)' }] },
                        { name: '', children: [{ name: 'Y4541-ZQ32 (?)' }, { name: 'Y4541-ZQ32 (米孜木汗)' }, { name: 'Y4541-ZQ32 (?)' }] },
                        { name: 'Y4541-FGC16605 (敖勒高努德)', children: [{ name: 'Y4541-FGC16605-FGC16593 (阿巴嘎)' }, { name: 'Y4541-FGC16605-FGC16593 (安)' }] },
                        { name: 'Y4541-FGC29011 (汪)', children: [{ name: 'Y4541-FGC29011-FGC29003 (孛儿只斤)', children: [{ name: 'Y4541-FGC29011-FGC29003-MF274950 (白)' }, { name: 'Y4541-FGC29011-FGC29003-MF274950 (陈)' }] }, { name: 'Y4541-FGC29011-FGC29003 (王古特)' }] },
                        { name: 'Y4541-Y125520 (关)', children: [{ name: 'Y4541-Y125520-ZQ1049 (布)', children: [{ name: 'Y4541-Y125520-ZQ1049-SK1076 (?)' }, { name: 'Y4541-Y125520-ZQ1049-SK1076 (?)' }] }] }
                    ]
                },
                { name: 'Y185715 (?)', children: [{ name: 'Y4569-Y185715 (关)', children: [{ name: 'Y185715-MF247416 (关)' }, { name: 'Y185715-MF247416 (李)' }] }] }
            ]
        };

        let nodeIdCounter = 0;
        const parentMap = {}, nodeMap = {}; 
        function initTree(node, parentId = null) {
            node.id = 'node_' + (nodeIdCounter++);
            parentMap[node.id] = parentId; nodeMap[node.id] = node;
            if (node.children) node.children.forEach(child => initTree(child, node.id));
        }
        initTree(rawTreeData);

        function calcTextWidth(text) {
            let width = 0; for (let i = 0; i < text.length; i++) width += text.charCodeAt(i) > 255 ? 13 : 7.5; 
            return Math.max(width + 24, 32); 
        }

        function buildRenderData(targetId) {
            const dataCopy = JSON.parse(JSON.stringify(rawTreeData));
            let ancestors = new Set(), descendants = new Set();
            let activePath = []; 
            
            if (targetId) {
                let curr = targetId;
                while (curr) { ancestors.add(curr); activePath.unshift(curr); curr = parentMap[curr]; }
                function addDescendants(nodeId) {
                    descendants.add(nodeId);
                    if (nodeMap[nodeId].children) nodeMap[nodeId].children.forEach(c => addDescendants(c.id));
                }
                addDescendants(targetId);
            }

            const N_total = Math.max(1, activePath.length - 1);
            
            function traverse(node, rawDepth, parentHadSpacer) {
                let isRoot = (node.id === 'node_0');
                let isTarget = (node.id === targetId);
                let isAncestor = ancestors.has(node.id) && !isTarget && !isRoot;
                let isDescendant = descendants.has(node.id) && !isTarget;
                let isUnrelated = targetId && !ancestors.has(node.id) && !descendants.has(node.id) && !isRoot && !isTarget;
                
                let activeIndex = activePath.indexOf(node.id);
                let originalChildren = node.children || [];
                const NODE_RADIUS = 6; 

                let incomingLineColor = GRADIENTS.default;
                let incomingLineWidth = 1.5;
                let incomingShadowBlur = 0;
                let incomingOpacity = 1;

                if (activeIndex > 0) {
                    let startRatio = (activeIndex - 1) / N_total;
                    let endRatio = activeIndex / N_total;
                    if (parentHadSpacer) {
                        startRatio = (activeIndex - 0.5) / N_total;
                    }
                    incomingLineColor = getSegmentGradient(startRatio, endRatio);
                    incomingLineWidth = 2.5;
                    incomingShadowBlur = 12; // 暗黑模式下加大发光模糊度
                } else if (isDescendant) {
                    incomingLineColor = GRADIENTS.default;
                    incomingLineWidth = 1.5;
                } else if (isUnrelated) {
                    incomingLineColor = COLORS.dimmedLine;
                    incomingLineWidth = 1.2;
                    incomingOpacity = 1; 
                }

                let shortName = node.name ? node.name.split('-').pop().trim() : '';
                let needsSpacer = (isTarget || isAncestor) && shortName && originalChildren.length > 0;

                if (isRoot) {
                    if (node.children) node.children.forEach(c => traverse(c, rawDepth + 1, false));
                    return;
                }

                if (!shortName) {
                    node.symbol = 'circle'; node.symbolSize = 6; node.symbolOffset = [0, 0];
                    node.itemStyle = { color: isUnrelated ? '#1E293B' : '#475A77', borderWidth: 0 };
                    node.label = { show: false };
                    node.lineStyle = { color: incomingLineColor, width: incomingLineWidth, shadowColor: incomingShadowBlur ? COLORS.glowShadow : 'transparent', shadowBlur: incomingShadowBlur, opacity: incomingOpacity };
                } else {
                    if (!targetId) {
                        node.symbol = 'circle'; node.symbolSize = NODE_RADIUS * 2; node.symbolOffset = [0, 0];
                        // 默认深色空心节点
                        node.itemStyle = { color: '#0A0F1C', borderColor: '#475A77', borderWidth: 2 };
                        node.label = { show: false }; 
                        node.lineStyle = { color: GRADIENTS.default, width: 1.5 };
                    } else {
                        if (isTarget) {
                            let tw = calcTextWidth(shortName);
                            node.symbol = 'roundRect'; node.symbolSize = [tw, 28]; node.symbolOffset = [tw / 2 - NODE_RADIUS, 0]; 
                            node.itemStyle = { color: COLORS.primary, borderRadius: 14, shadowColor: COLORS.glowShadow, shadowBlur: 15 };
                            node.label = { show: true, position: 'inside', color: '#fff', fontSize: 13, fontWeight: '600' , formatter: shortName };
                            node.lineStyle = { color: incomingLineColor, width: incomingLineWidth, shadowColor: COLORS.glowShadow, shadowBlur: incomingShadowBlur, opacity: 1 };
                        } else if (isAncestor) {
                            let tw = calcTextWidth(shortName);
                            node.symbol = 'roundRect'; node.symbolSize = [tw, 24]; node.symbolOffset = [tw / 2 - NODE_RADIUS, 0];
                            // 路径上的祖先节点：深蓝底色+荧光蓝边框
                            node.itemStyle = { color: '#0F172A', borderColor: '#00E1FD', borderWidth: 1.5, borderRadius: 12, shadowColor: 'rgba(0,225,253,0.3)', shadowBlur: 8 };
                            node.label = { show: true, position: 'inside', color: '#E2E8F0', fontSize: 12, fontWeight: '500', formatter: shortName };
                            node.lineStyle = { color: incomingLineColor, width: incomingLineWidth, shadowColor: COLORS.glowShadow, shadowBlur: incomingShadowBlur, opacity: 1 };
                        } else if (isDescendant) {
                            node.symbol = 'circle'; node.symbolSize = NODE_RADIUS * 2; node.symbolOffset = [0, 0];
                            node.itemStyle = { color: '#0A0F1C', borderColor: '#00E1FD', borderWidth: 2 };
                            node.label = { show: false }; 
                            node.lineStyle = { color: incomingLineColor, width: incomingLineWidth, opacity: 1 };
                        } else {
                            node.symbol = 'circle'; node.symbolSize = NODE_RADIUS * 2; node.symbolOffset = [0, 0];
                            node.itemStyle = { color: '#0A0F1C', borderColor: COLORS.nodeBorder, borderWidth: 1.5 };
                            node.label = { show: false }; 
                            node.lineStyle = { color: incomingLineColor, width: incomingLineWidth, opacity: incomingOpacity };
                        }
                    }
                }

                if (needsSpacer) {
                    let spacerLineColor = GRADIENTS.default;
                    let spacerLineWidth = 1.5;
                    let spacerShadowBlur = 0;

                    if (isAncestor) {
                        let startRatio = activeIndex / N_total;
                        let endRatio = (activeIndex + 0.5) / N_total;
                        spacerLineColor = getSegmentGradient(startRatio, endRatio);
                        spacerLineWidth = 2.5;
                        spacerShadowBlur = 12;
                    }

                    node.children = [{
                        name: '', id: node.id + '_spacer',
                        symbol: 'circle', symbolSize: 1, 
                        itemStyle: { color: 'transparent', borderColor: 'transparent' },
                        label: { show: false },
                        lineStyle: { 
                            color: spacerLineColor, 
                            width: spacerLineWidth, 
                            shadowColor: spacerShadowBlur ? COLORS.glowShadow : 'transparent', 
                            shadowBlur: spacerShadowBlur, 
                            opacity: 1 
                        }, 
                        children: originalChildren
                    }];
                } else {
                    node.children = originalChildren;
                }

                originalChildren.forEach(c => traverse(c, rawDepth + 1, needsSpacer));
            }
            
            traverse(dataCopy, 0, false);
            return dataCopy;
        }

        let currentHighlight = null;

        const baseOption = {
            tooltip: {
                // 暗黑模式专属 Tooltip 悬浮提示框
                trigger: 'item', backgroundColor: 'rgba(15, 23, 42, 0.95)', 
                borderColor: '#334155', borderWidth: 1, padding: [10, 14], borderRadius: 8,
                boxShadow: '0 8px 30px rgba(0,0,0,0.5)', textStyle: { color: '#F8FAFC', fontSize: 13, fontWeight: '600' },
                formatter: function(params) {
                    if (params.dataType === 'edge') return '';
                    if (params.data.id && params.data.id.endsWith('_spacer')) return '';
                    if (!params.data.name) return '';
                    return params.data.name.replace('\n', ' '); 
                }
            },
            series: [
                {
                    id: 'familyTree', type: 'tree',
                    data: [buildRenderData(null)],
                    roam: true, scaleLimit: { min: 0.3, max: 3 },
                    top: '-30%', bottom: '-30%', left: '12%', right: '15%',
                    initialTreeDepth: 10, expandAndCollapse: false, emphasis: { disabled: true }, 
                    lineStyle: { curveness: 0.6 },
                    animationDuration: 650, animationDurationUpdate: 650, animationEasingUpdate: 'cubicInOut'
                }
            ]
        };
        myChart.setOption(baseOption);

        myChart.on('click', function(params) {
            let clickedId = params.data ? params.data.id : null;
            if (clickedId && params.data.name && !clickedId.endsWith('_spacer')) {
                currentHighlight = (currentHighlight === clickedId) ? null : clickedId;
                myChart.setOption({ series: [{ id: 'familyTree', data: [buildRenderData(currentHighlight)] }] });
            }
        });

        myChart.getZr().on('click', function(event) {
            if (!event.target && currentHighlight) {
                currentHighlight = null;
                myChart.setOption({ series: [{ id: 'familyTree', data: [buildRenderData(null)] }] });
            }
        });

        let currentZoom = 1;
        const zoomSlider = document.getElementById('zoom-slider');

        function setZoom(newZoom) {
            currentZoom = Math.max(0.3, Math.min(newZoom, 3)); zoomSlider.value = currentZoom;
            myChart.setOption({ series: [{ id: 'familyTree', zoom: currentZoom }] });
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(currentZoom + 0.15));
        document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(currentZoom - 0.15));
        zoomSlider.addEventListener('input', (e) => setZoom(parseFloat(e.target.value)));
        
        document.getElementById('btn-reset').addEventListener('click', () => {
            myChart.dispatchAction({ type: 'restore' }); 
            currentZoom = 1; zoomSlider.value = 1;
            myChart.setOption({ series: [{ id: 'familyTree', zoom: 1 }] });
        });

        myChart.on('roam', function(params) {
            if (params.zoom) {
                currentZoom *= params.zoom; currentZoom = Math.max(0.3, Math.min(currentZoom, 3));
                zoomSlider.value = currentZoom;
            }
        });

        window.addEventListener('resize', function() { myChart.resize(); });
    </script>
</body>
</html>
